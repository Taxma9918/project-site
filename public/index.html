<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαδικτυακή Εφαρμογή Ευγένιου Ντελακρουά</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Διαδικτυακή Εφαρμογή Ζωγράφου</h1>
        <p class="subtitle">Ευγένιος Ντελακρουά (1798–1863)</p>
    </header>

    <nav class="top-menu" aria-label="Κύριο μενού">
        <ul>
            <li><button type="button" data-menu="bio">Βιογραφία</button></li>
            <li><button type="button" data-menu="paintings">Πίνακες</button></li>
            <li><button type="button" data-menu="exhibitions">Εκθέσεις</button></li>
            <li><button type="button" data-menu="links">Σύνδεσμοι</button></li>
            <li><button type="button" data-menu="admin">Διαχείριση</button></li>
        </ul>
    </nav>

    <div class="container">
        <aside aria-label="Υπομενού">
            <div id="bio-menu" class="submenu hidden">
                <h3>Βιογραφία</h3>
                <p>Επιλέξτε κατηγορία...</p>
                <ul>
                    <li><button type="button" data-bio="birth">Γέννηση</button></li>
                    <li><button type="button" data-bio="career">Έργα</button></li>
                </ul>
            </div>

            <div id="paintings-menu" class="submenu hidden">
                <h3>Κατηγορίες Πινάκων</h3>
                <ul>
                    <li><button type="button" data-paintings="all">Όλοι οι Πίνακες</button></li>
                    <li><button type="button" data-paintings="landscapes">Τοπία</button></li>
                    <li><button type="button" data-paintings="portraits">Πορτρέτα</button></li>
                </ul>
            </div>

            <div id="exhibitions-menu" class="submenu hidden">
                <h3>Εκθέσεις</h3>
                <p>Επιλέξτε κατηγορία...</p>
                <ul>
                    <li><button type="button" data-exhibitions="current">Τρέχουσες Εκθέσεις</button></li>
                    <li><button type="button" data-exhibitions="past">Παρελθούσες Εκθέσεις</button></li>
                </ul>
            </div>

            <div id="links-menu" class="submenu hidden">
                <h3>Σύνδεσμοι</h3>
                <p>Επιλέξτε κατηγορία...</p>
                <ul>
                    <li><button type="button" data-links="web_links">Διαδικτυακοί Σύνδεσμοι</button></li>
                    <li><button type="button" data-links="bibliography">Βιβλιογραφία</button></li>
                </ul>
            </div>

            <div id="admin-menu" class="submenu hidden">
                <h3>Διαχείριση</h3>

                <div id="login-section" class="login-section">
                    <h4>Σύνδεση Χρήστη</h4>
                    <form id="login-form">
                        <label for="username">Όνομα Χρήστη:</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                        <label for="password">Κωδικός:</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                        <button type="submit">Σύνδεση</button>
                    </form>
                    <p id="login-error" class="error" role="alert" hidden></p>
                </div>

                <div id="session-section" class="hidden">
                    <h4>Καλωσήρθατε, <span id="session-name"></span>!</h4>
                    <div id="admin-actions" class="hidden admin-section">
                        <button type="button" data-manage="exhibitions">Διαχείριση Εκθέσεων</button>
                        <button type="button" data-manage="links">Διαχείριση Συνδέσμων</button>
                    </div>
                    <button type="button" id="logout-button">Αποσύνδεση</button>
                </div>
            </div>
        </aside>

        <main id="main-content">
            <p>Καλωσορίσατε! Επιλέξτε μια επιλογή από το μενού.</p>
        </main>
    </div>

    <footer>
        <p>Copyright © <span id="footer-year">2025</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
