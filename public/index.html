<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Διαδικτυακή Εφαρμογή Ευγένιου Ντελακρουά</title>
    <meta name="description" content="Διαδικτυακή εφαρμογή παρουσίασης του ζωγράφου Ευγένιου Ντελακρουά (1798–1863): βιογραφία, γκαλερί έργων, εκθέσεις και βιβλιογραφία.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <!-- Προεπισκόπηση όταν ο σύνδεσμος μοιράζεται σε μέσα κοινωνικής δικτύωσης ή
         σε εφαρμογές μηνυμάτων. Οι διευθύνσεις είναι απόλυτες επίτηδες: οι
         περισσότεροι scrapers δεν αναλύουν σχετικές διαδρομές. Αν αλλάξει η
         διεύθυνση του ιστότοπου, αυτές οι δύο θέλουν ενημέρωση. -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="el_GR">
    <meta property="og:site_name" content="Διαδικτυακή Εφαρμογή Ζωγράφου">
    <meta property="og:title" content="Ευγένιος Ντελακρουά (1798–1863)">
    <meta property="og:description" content="Διαδικτυακή εφαρμογή παρουσίασης του ζωγράφου Ευγένιου Ντελακρουά (1798–1863): βιογραφία, γκαλερί έργων, εκθέσεις και βιβλιογραφία.">
    <meta property="og:url" content="https://delacroix-site.onrender.com/">
    <meta property="og:image" content="https://delacroix-site.onrender.com/images/Eug%C3%A8ne_Delacroix_-_La_libert%C3%A9_guidant_le_peuple.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="skip-link" href="#main-content">Μετάβαση στο περιεχόμενο</a>

    <header>
        <h1>Διαδικτυακή Εφαρμογή Ζωγράφου</h1>
        <p class="subtitle">Ευγένιος Ντελακρουά (1798–1863)</p>
    </header>

    <!--
      Κάθε ενότητα κρύβει τις επιλογές της σε πτυσσόμενο πάνελ. Το κουμπί της
      ενότητας τις εμφανίζει, και δηλώνει την κατάστασή του με aria-expanded
      ώστε να τη διαβάζουν και οι αναγνώστες οθόνης.
    -->
    <nav class="top-menu" aria-label="Κύριο μενού">
        <ul class="menu-bar">
            <li class="menu-item">
                <button type="button" data-nav="bio" aria-expanded="false" aria-controls="bio-menu">
                    Βιογραφία
                </button>
                <div id="bio-menu" class="submenu hidden">
                    <p class="submenu-hint">Επιλέξτε κατηγορία</p>
                    <ul>
                        <li><button type="button" data-nav="bio/all">Όλα</button></li>
                        <li><button type="button" data-nav="bio/birth">Γέννηση</button></li>
                        <li><button type="button" data-nav="bio/career">Έργα</button></li>
                    </ul>
                </div>
            </li>

            <li class="menu-item">
                <button type="button" data-nav="paintings" aria-expanded="false" aria-controls="paintings-menu">
                    Πίνακες
                </button>
                <div id="paintings-menu" class="submenu hidden">
                    <p class="submenu-hint">Κατηγορίες πινάκων</p>
                    <ul>
                        <li><button type="button" data-nav="paintings/all">Όλα</button></li>
                        <li><button type="button" data-nav="paintings/landscapes">Τοπία</button></li>
                        <li><button type="button" data-nav="paintings/portraits">Πορτρέτα</button></li>
                    </ul>
                </div>
            </li>

            <li class="menu-item">
                <button type="button" data-nav="exhibitions" aria-expanded="false" aria-controls="exhibitions-menu">
                    Εκθέσεις
                </button>
                <div id="exhibitions-menu" class="submenu hidden">
                    <p class="submenu-hint">Επιλέξτε κατηγορία</p>
                    <ul>
                        <li><button type="button" data-nav="exhibitions/all">Όλα</button></li>
                        <li><button type="button" data-nav="exhibitions/current">Τρέχουσες Εκθέσεις</button></li>
                        <li><button type="button" data-nav="exhibitions/past">Παρελθούσες Εκθέσεις</button></li>
                    </ul>
                </div>
            </li>

            <li class="menu-item">
                <button type="button" data-nav="links" aria-expanded="false" aria-controls="links-menu">
                    Σύνδεσμοι
                </button>
                <div id="links-menu" class="submenu hidden">
                    <p class="submenu-hint">Επιλέξτε κατηγορία</p>
                    <ul>
                        <li><button type="button" data-nav="links/all">Όλα</button></li>
                        <li><button type="button" data-nav="links/web_links">Διαδικτυακοί Σύνδεσμοι</button></li>
                        <li><button type="button" data-nav="links/bibliography">Βιβλιογραφία</button></li>
                    </ul>
                </div>
            </li>

            <!-- Η διαχείριση δεν έχει πτυσσόμενο: η σύνδεση και οι ενέργειές της
                 ζωγραφίζονται μέσα στη σελίδα, όπου υπάρχει χώρος. -->
            <li class="menu-item">
                <button type="button" data-nav="admin">Διαχείριση</button>
            </li>
        </ul>
    </nav>

    <div class="container">
        <main id="main-content" tabindex="-1" aria-live="polite">
            <p>Καλωσορίσατε! Επιλέξτε μια επιλογή από το μενού.</p>
        </main>
    </div>

    <footer>
        <p>Copyright © <span id="footer-year"></span></p>
    </footer>

    <!-- Μεγέθυνση πίνακα. Μένει κρυφό μέχρι να επιλεγεί κάποιο έργο. -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true"
         aria-labelledby="lightbox-caption" hidden>
        <div class="lightbox-inner">
            <button type="button" id="lightbox-close" class="lightbox-close"
                    aria-label="Κλείσιμο">&times;</button>
            <img id="lightbox-image" alt="">
            <p id="lightbox-caption" class="lightbox-caption"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
