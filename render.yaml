# Blueprint για ανάπτυξη στο Render (https://render.com).
#
# Στο Render: New > Blueprint, επιλογή αυτού του repository. Διαβάζει αυτό το
# αρχείο και στήνει την υπηρεσία χωρίς άλλη παραμετροποίηση. Το Render ορίζει
# μόνο του τη μεταβλητή PORT, την οποία ήδη διαβάζει ο server.
#
# Προσοχή στο δωρεάν πλάνο: ο δίσκος είναι εφήμερος. Ό,τι προστεθεί από τις
# οθόνες διαχείρισης γράφεται στα αρχεία του data/ και χάνεται σε κάθε
# επανεκκίνηση ή νέα ανάπτυξη, καθώς ο φάκελος ξαναγράφεται από το repository.
# Για μόνιμη αποθήκευση χρειάζεται είτε πραγματική βάση δεδομένων, είτε
# προσαρτημένος δίσκος στο data/ (διαθέσιμος σε πληρωμένο πλάνο).
services:
  - type: web
    name: delacroix-site
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
